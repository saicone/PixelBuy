import org.gradle.api.attributes.java.TargetJvmVersion

import java.time.LocalDate
import java.time.ZoneOffset

plugins {
    id 'java'
    id 'idea'
    id 'com.gradleup.shadow' version '9.6.1'
}

def resolveCommitHash = {
    def githubSha = System.getenv('GITHUB_SHA')
    if (githubSha && githubSha.trim()) {
        return githubSha.trim().take(7)
    }
    try {
        def process = ['git', 'rev-parse', '--short', 'HEAD'].execute(null, rootDir)
        process.waitFor()
        def hash = process.in.text.trim()
        return hash ? hash : 'local'
    } catch (Exception ignored) {
        return 'local'
    }
}

def now = LocalDate.now(ZoneOffset.UTC)
def dynamicVersion = "${now.year}.${now.monthValue}.${now.dayOfMonth}-${resolveCommitHash()}"

allprojects {
    version = dynamicVersion
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

repositories {
    mavenCentral()
    maven { url = uri('https://central.sonatype.com/repository/maven-snapshots') }
    maven { url = uri('https://jitpack.io') }
    maven { url = uri('https://hub.spigotmc.org/nexus/content/repositories/snapshots/') }
    maven { url = uri('https://repo.codemc.io/repository/nms/') }
    maven { url = uri('https://nexus.phoenixdevt.fr/repository/maven-public/') }
    maven { url = uri('https://maven.devs.beer/') }
    maven { url = uri('https://repo.bg-software.com/repository/api/') }
    maven { url = uri('https://repo.extendedclip.com/content/repositories/placeholderapi/') }
    maven { url = uri('https://repo.nexomc.com/releases') }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    from(sourceSets.main.resources.srcDirs) {
        include 'plugin.yml'
        expand(version: project.version)
    }
}

configurations.all {
    if (canBeResolved) {
        attributes {
            attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
        }
    }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:26.2-R0.1-SNAPSHOT'

    compileOnly('com.nexomc:nexo:1.17.0') { transitive = false }
    compileOnly 'com.github.oraxen:oraxen:1.173.0'
    compileOnly('io.lumine:MythicLib-dist:1.7.1-SNAPSHOT') { transitive = false } // Required by MMOItems
    compileOnly('net.Indyuce:MMOItems-API:6.10.1-SNAPSHOT') { transitive = false }
    compileOnly('dev.lone:api-itemsadder:4.0.10') { transitive = false }
    compileOnly 'com.bgsoftware:WildToolsAPI:2025.2'
    compileOnly 'me.clip:placeholderapi:2.11.7'
    compileOnly 'net.luckperms:api:5.4'
    compileOnly 'com.saicone.rtag:rtag:1.5.17'
    compileOnly 'com.saicone.rtag:rtag-item:1.5.17'

    // Library loader
    implementation 'com.saicone.ezlib:ezlib:1.3.2'
    implementation 'com.saicone.ezlib:loader:1.3.2'
    compileOnly 'com.saicone.ezlib:annotations:1.3.2'
    annotationProcessor 'com.saicone.ezlib:annotations:1.3.2'

    // Implementation
    compileOnly 'com.github.cryptomorin:XSeries:13.7.1'
    compileOnly 'com.saicone:nbt:1.0.4'
    compileOnly 'com.saicone:delivery4j:1.1.6'
    compileOnly 'com.saicone:delivery4j-broker-sql-hikari:1.1.6'
    compileOnly 'com.saicone:delivery4j-broker-redis-jedis:1.1.6'
    compileOnly 'com.saicone:delivery4j-broker-rabbitmq:1.1.6'

    compileOnly 'org.jetbrains:annotations:26.1.0'

    compileOnly fileTree(dir: 'libs', includes: ['*.jar'])
}

compileJava {
    options.encoding = 'UTF-8'
}

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(25))
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

jar {
    enabled = false
    dependsOn (shadowJar)
}

shadowJar {
    archiveClassifier.set('')

    // implementation
    relocate 'com.saicone.ezlib', project.group + '.ezlib'
    relocate 'com.cryptomorin.xseries', project.group + '.libs.xseries'
    relocate 'com.saicone.rtag', project.group + '.libs.rtag'
    relocate 'com.zaxxer.hikari', project.group + '.libs.hikari'
    relocate 'redis.clients.jedis', project.group + '.libs.jedis'
    relocate 'com.rabbitmq', project.group + '.libs.rabbitmq'
    relocate 'com.google.common', project.group + '.libs.guava'
    relocate 'com.google.gson', project.group + '.libs.gson'
    relocate 'com.saicone.delivery4j', project.group + '.libs.delivery4j'
    relocate 'com.saicone.nbt', project.group + '.libs.nbt'

    // drivers
    relocate 'org.mariadb.jdbc', project.group + '.libs.mariadb'
    relocate 'org.postgresql', project.group + '.libs.postgresql'
    relocate 'org.h2', project.group + '.libs.h2'

    minimize()
}